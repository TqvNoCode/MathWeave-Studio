[project]
name = "mathweave-studio"
version = "0.1.0"
description = "MathWeave Studio — Phần mềm Hỗ trợ Học tập & Nghiên cứu Toán học Chuyên sâu"
readme = "README.md"
authors = [
    { name = "TqvNoCode", email = "92263302+TqvNoCode@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "latex2mathml>=3.81.1",
    "nicegui>=3.18.0",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "pythonnet>=3.0.0; sys_platform == 'win32'",
    "pywebview>=6.2.1",
    "qtpy>=2.4.3",
    "sympy>=1.14.0",
]

[project.scripts]
mathweave-studio = "math_app.main:main"
math-app = "math_app.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "math_app"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
